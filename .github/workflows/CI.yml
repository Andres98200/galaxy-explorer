name: Continuous Integration

on: 
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:

    commit-lint-check:
        name: Commit Message Check
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Check Commit Standard
          uses: gsactions/commit-message-checker@v2
          with:
            # Verify if the commit message follows the Conventional Commits standard
            pattern: '^(feat|fix|ci|docs|style|refactor|test|chore)(\([a-zA-Z0-9_-]+\))?: .+'
            error: '❌ Your commit message does not follow the Conventional Commits standard! Example of a valid message: "feat(frontend): add 3d canvas"'
            excludeDescription: 'true' # Verify only the title of the commit message, not the description
            excludeTitle: 'true' 
            checkAllCommitsInTriggeringPush: 'true' 


    # Backend Verification (Python Linting)
    backend-lint-check:
        name: Backend Check (Python)
        runs-on: ubuntu-latest
        needs: commit-lint-check
        steps:
            # Checkout the code to the runner
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: 3.11

            - name: Install Dependencies
            # Install the backend dependencies to be able to do a syntax check and import test. We don't run the tests here, just a simple import check to catch basic syntax errors and missing dependencies.
              run: |
                cd backend 
                python -m pip install --upgrade pip
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

            - name: Test import / Syntax check
            # Simple syntax check by trying to import the main modules of the backend. This will catch basic syntax errors and missing dependencies.
              run: |
                cd backend
                python -m py_compile app/main.py app/repositories/data_repository.py
    
    frontend-lint-check:
        name: Frontend Check (React + TypeScript)
        runs-on: ubuntu-latest
        needs: commit-lint-check
        steps:
            # Checkout the code to the runner
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: ./frontend/package-lock.json

            - name: Install Dependencies
              run: |
                cd frontend 
                npm ci

            - name: Lint Frontend Code
              run: |
                cd frontend
                npm run build
