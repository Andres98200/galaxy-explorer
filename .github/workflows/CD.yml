name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/galaxy-explorer
          git pull origin main

      - name: Rebuild & Restart Docker Containers
        run: |
          cd ~/galaxy-explorer
          docker compose up --build -d