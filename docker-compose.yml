services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: AXECOM_AI_backend
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: AXECOM_AI_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always